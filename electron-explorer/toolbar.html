<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      height: 44px;
      padding: 0 14px;
      background: #0a0a0a;
      background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 20px 20px;
      color: #e2e8f0;
      font-family: 'Orbitron', -apple-system, sans-serif;
      font-size: 12px;
      font-weight: 500;
      border-bottom: 1px solid rgba(255,255,255,0.15);
      text-shadow: 0 0 4px rgba(255,255,255,0.15);
    }
    .toolbar label { flex-shrink: 0; color: #94a3b8; letter-spacing: 0.05em; }
    .toolbar input {
      flex: 1;
      min-width: 140px;
      padding: 6px 12px;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 6px;
      background: rgba(15,15,15,0.9);
      color: #e2e8f0;
      font-family: 'Orbitron', monospace;
      font-size: 11px;
    }
    .toolbar input::placeholder { color: #64748b; }
    .toolbar input:focus { outline: none; border-color: #ff5757; box-shadow: 0 0 8px rgba(255,87,87,0.25); }
    .toolbar button {
      padding: 6px 16px;
      border: 1px solid rgba(255,87,87,0.5);
      border-radius: 6px;
      background: #ff5757;
      color: #fff;
      font-family: 'Orbitron', sans-serif;
      font-weight: 600;
      font-size: 11px;
      letter-spacing: 0.05em;
      cursor: pointer;
      text-shadow: 0 0 6px rgba(0,0,0,0.3);
    }
    .toolbar button:hover { background: #ef4444; box-shadow: 0 0 10px rgba(255,87,87,0.4); }
    .toolbar .hint { color: #64748b; font-size: 10px; letter-spacing: 0.03em; }
  </style>
</head>
<body>
  <div class="toolbar">
    <label for="url">BROWSER (PROXIED)</label>
    <input id="url" type="text" placeholder="https://example.com" />
    <button id="go">GO</button>
    <span class="hint">→ 127.0.0.1:8080 • Hover to highlight, click to map</span>
  </div>
  <script src="toolbar.js"></script>
</body>
</html>
